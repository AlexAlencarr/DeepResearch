name: Pipeline de Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analise-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Linter (Flake8)
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Executar Verificação de Estilo (Linter)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --ignore=F401,F841 --show-source --statistics


