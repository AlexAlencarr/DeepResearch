      - name: Rodar Ruff Check e Fix
        run: |
          # O --exit-zero impede que o erro 1 pare o workflow antes do commit
          ruff check --fix --exit-zero .
          
      - name: Rodar Ruff Format
        run: ruff format .

      - name: Commit das correções
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: correções automáticas Ruff (lint/format)"
          # Garante que o commit aconteça mesmo se o Ruff falhar no check
          status_options: '--untracked-files=no'
